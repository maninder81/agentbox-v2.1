id: env-files
kind: integration
category: extras
title: Environment files
description: Per-repo .env files for agents, kept in <secrets>/<repo>/ (mirroring the repo's folders, 0600), never in the repos
optional: true
depends: [core]
instructions:
  summary: |
    Environment files: each repo's env files live in {{paths.secrets}}/<repo>/ (same folders as the repo, e.g. frontend/.env.local); symlink the ones you need into your worktree, never print or commit them.
    Rules: /team/integrations/env-files.md
  file: instructions.md
skills: []
default_roles: [coder, tester]
revoke: |
  Delete the files under `$(agentbox config get paths.secrets)/<repo>/.env`, and rotate any credentials they held.
steps:
  - id: files
    title: Add your .env files
    human: true
    instructions: |
      For each repo that needs one, save it in the terminal (the value is read from stdin):
        `agentbox secret set <repo>/.env < path/to/.env`
      or paste it: `agentbox secret set <repo>/.env`, paste (it shows masked), then Enter on an empty line.
      Agents symlink or copy them into their worktrees; they never commit them.
    copy: "agentbox secret set example-repo/.env"
    check: "find \"$(agentbox config get paths.secrets)\" -mindepth 2 \\( -name '*.env' -o -name '.env.*' \\) -type f | grep -q ."
  - id: verify
    title: Files present and private (0600)
    run: verify.sh
    check: "! find \"$(agentbox config get paths.secrets)\" \\( -type f ! -perm 600 \\) -o \\( -type d ! -perm 700 \\) | grep -q ."
