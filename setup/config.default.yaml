# agentbox config (docs/V2-ARCHITECTURE.md § 2). Root-owned, 0644, no secrets.
# Written once by setup/bootstrap.sh; change it with `sudo agentbox config set <key> <value>`.
host: @HOST@              # cloud | lima
access: @ACCESS@          # tailscale | cloudflare | ssh-tunnel (localhost only)
user: @USER@              # the unix user agents run as
agent_sudo: true          # passwordless sudo for the agent user (selftest warns: audit H3)
docker: false             # install docker and add the agent user to its group (root-equivalent)
paths:
  src: @SRC@              # this repo (lima: the read-only mount)
  app: /opt/agentbox/app
  data: /opt/agentbox/data
  work: /work
  agents: /agents
  team: /team
  skills: /skills
  secrets: /secrets
ports:                    # all bound to 127.0.0.1
  portal: 7700
  screen: 7701
  terminal: 7702
  gateway: 7710
  guide: 7699
  bench: 7740              # first of 40 ports for devices shared by the device bridge (bench)
  apps: 7790               # hosting gateway (what agents host); the services themselves use 7800–7899
  share: 7785              # shared work for guests (only through the ngrok tunnel, while a link is live)
modules:                  # base: core, claude and access are always on; display and terminal too by default
  display: true
  terminal: true
  # Integrations: off until connected from the portal (or `agentbox integration connect <id>`).
  # Their settings live in /etc/agentbox/integrations/<id>.yaml.
  github: false
  gitlab: false
  bitbucket: false
  aws: false
  gcp: false
  azure: false
  kubernetes: false
  db-tunnel: false
  env-files: false
  voice: false
  mobile: false           # needs access: tailscale
  mobile-app: false
  push: false
  bench: false            # device bridge: your computer's USB devices for agents
  onshape: false          # agents upload CAD models to your Onshape for review
  ngrok: false            # share one piece of work with someone outside your tailnet (a link with an expiry)
tailscale: { hostname: "" }                         # set by the access module
cloudflare: { hostname: "", team_domain: "", aud: "" }  # set by the access module
owner: { tailscale_login: "", email: "" }           # who may use the portal (set during setup)
mobile: { serve_port: 8443, expo_owner: "", eas_project_id: "" }   # gateway: https://<node>.ts.net:<serve_port>
hosting: { serve_port: 10000 }                      # hosted services: https://<node>.ts.net:<serve_port>/<name>/
limits:                   # how much runs at once (restart the portal to apply)
  running_turns: 10       # agent turns in flight across all agents; each is a Claude process
  per_role: 10            # live tasks of one role an agent may start (a role's own setting overrides)
